# Ambiente de dev da API nova (ADR 0010, branch feat/arquitetura-atrena).
# Projeto, portas e volumes SEPARADOS do dev antigo (nextflow-development, Postgres em 5432): os dois podem rodar
# juntos e subir este não toca no banco antigo.
#   docker compose -f compose.development.yaml up -d postgres   # só o banco (API rodando com dotnet run)
#   docker compose -f compose.development.yaml up -d            # banco + storage + API em watch
#   docker compose -f compose.development.yaml --profile front up -d   # + front buildado no nginx (8082)
name: nextflow-v2-development

services:
  postgres:
    image: nextflow-v2-postgres:development
    build:
      context: .
      dockerfile: Dockerfile.postgres
      args:
        DB_TIMEZONE: ${DB_TIMEZONE:-America/Sao_Paulo}
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-nextflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nextflow_password}
    restart: unless-stopped
    # Só em 127.0.0.1: abre no seu PC, mas ninguém de fora alcança
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - nextflow_v2_postgres_data_dev:/var/lib/postgresql/data
    networks:
      - nextflow-v2-development-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nextflow_user} -d ${POSTGRES_DB:-nextflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Storage compatível com S3 (imagens de produtos, a partir da F1.3). Programa: Silo, fork comunitário do MinIO.
  storage:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STORAGE_PORT:-9010}:9000"           # API S3
      - "127.0.0.1:${STORAGE_CONSOLE_PORT:-9011}:9001"   # painel web
    environment:
      MINIO_ROOT_USER: ${STORAGE_ROOT_USER:-nextflow-admin}
      MINIO_ROOT_PASSWORD: ${STORAGE_ROOT_PASSWORD:-nextflow-admin-secret}
    command: server /data --console-address ":9001"
    volumes:
      - nextflow_v2_storage_data_dev:/data
    networks:
      - nextflow-v2-development-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Roda uma vez a cada "up": cria buckets, acesso público e o usuário da API (storage/init.sh), depois encerra
  storage-initial-setup:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"
    volumes:
      - ./storage/init.sh:/init.sh:ro
    environment:
      MINIO_ROOT_USER: ${STORAGE_ROOT_USER:-nextflow-admin}
      MINIO_ROOT_PASSWORD: ${STORAGE_ROOT_PASSWORD:-nextflow-admin-secret}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-nextflow}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-nextflow-secret}
      STORAGE_BUCKET_PUBLIC: ${STORAGE_BUCKET_PUBLIC:-nextflow-public}
      STORAGE_BUCKET_PRIVATE: ${STORAGE_BUCKET_PRIVATE:-nextflow-private}
    networks:
      - nextflow-v2-development-network
    depends_on:
      storage:
        condition: service_healthy

  backend:
    image: nextflow-v2-backend:development
    build:
      context: .
      dockerfile: Dockerfile.development
    working_dir: /src
    volumes:
      - .:/src
      - nextflow_v2_nuget_cache:/root/.nuget/packages
      # Evita "Access denied" no build no Windows: bin/obj ficam em volumes do Docker
      - nextflow_v2_backend_bin:/src/nextflow/bin
      - nextflow_v2_backend_obj:/src/nextflow/obj
      - nextflow_v2_backend_app_bin:/src/nextflow.Application/bin
      - nextflow_v2_backend_app_obj:/src/nextflow.Application/obj
      - nextflow_v2_backend_domain_bin:/src/nextflow.Domain/bin
      - nextflow_v2_backend_domain_obj:/src/nextflow.Domain/obj
      - nextflow_v2_backend_infra_bin:/src/nextflow.Infrastructure/bin
      - nextflow_v2_backend_infra_obj:/src/nextflow.Infrastructure/obj
      - nextflow_v2_backend_tests_bin:/src/nextflow.Tests/bin
      - nextflow_v2_backend_tests_obj:/src/nextflow.Tests/obj
    env_file:
      - path: .env
        required: false
    environment:
      # Sem JWT_KEY no .env vale a chave de desenvolvimento do appsettings.Development.json
      JwtSettings__Key: ${JWT_KEY:-nextflow-chave-de-desenvolvimento-nao-use-fora-do-dev-0001}
      ConnectionStrings__DefaultConnection: "Server=postgres;Port=5432;Database=${POSTGRES_DB:-nextflow_db};User Id=${POSTGRES_USER:-nextflow_user};Password=${POSTGRES_PASSWORD:-nextflow_password};Pooling=true;"
      Seed__Demo__Enabled: ${SEED_DEMO_ENABLED:-true}
      Seed__Demo__AnchorDate: ${SEED_DEMO_ANCHOR_DATE:-}
      Storage__Endpoint: http://storage:9000
      Storage__PublicUrl: ${STORAGE_PUBLIC_URL:-http://localhost:9010}
      Storage__AccessKey: ${STORAGE_ACCESS_KEY:-nextflow}
      Storage__SecretKey: ${STORAGE_SECRET_KEY:-nextflow-secret}
      Storage__Buckets__Public: ${STORAGE_BUCKET_PUBLIC:-nextflow-public}
      Storage__Buckets__Private: ${STORAGE_BUCKET_PRIVATE:-nextflow-private}
      # IA (Previsão de demanda): sem AI_API_KEY a análise roda só com o cálculo
      Ai__Provider: ${AI_PROVIDER:-Gemini}
      Ai__ApiKey: ${AI_API_KEY:-}
      Ai__Model: ${AI_MODEL:-gemini-flash-latest}
      Ai__FallbackModel: ${AI_FALLBACK_MODEL:-gemini-flash-lite-latest}
      Ai__TimeoutSeconds: ${AI_TIMEOUT_SECONDS:-60}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8081}:8080"
    networks:
      - nextflow-v2-development-network
    depends_on:
      postgres:
        condition: service_healthy
      storage-initial-setup:
        condition: service_completed_successfully

  # Front (repo irmão, padrão ../nextflow-front; outro caminho via FRONT_CONTEXT): build de produção servido pelo nginx.
  # Opcional (profile "front"): no dia a dia o front roda com hot reload no compose.development.yaml do próprio repo
  # (5174); suba este só para conferir o build de produção:  docker compose -f compose.development.yaml --profile front up -d
  # A URL da API entra no build do Vite (fica embutida no JS) e é a que o NAVEGADOR chama: mudou, rode com --build.
  # Em localhost:8082 (porta 80 do nginx); o hot reload segue no compose.development.yaml do próprio front (5174).
  frontend:
    profiles: ["front"]
    image: nextflow-v2-front:compose
    build:
      context: ${FRONT_CONTEXT:-../nextflow-front}
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8081}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONT_PORT:-8082}:80"
    networks:
      - nextflow-v2-development-network
    depends_on:
      - backend

networks:
  nextflow-v2-development-network:

volumes:
  nextflow_v2_postgres_data_dev:
  nextflow_v2_storage_data_dev:
  nextflow_v2_nuget_cache:
  nextflow_v2_backend_bin:
  nextflow_v2_backend_obj:
  nextflow_v2_backend_app_bin:
  nextflow_v2_backend_app_obj:
  nextflow_v2_backend_domain_bin:
  nextflow_v2_backend_domain_obj:
  nextflow_v2_backend_infra_bin:
  nextflow_v2_backend_infra_obj:
  nextflow_v2_backend_tests_bin:
  nextflow_v2_backend_tests_obj:
