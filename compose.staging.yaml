name: nextflow-backend-staging
services:
  postgres:
    image: nextflow-postgres:staging
    build:
      context: .
      dockerfile: Dockerfile.postgres
      args:
        DB_TIMEZONE: ${DB_TIMEZONE:-America/Sao_Paulo}
    restart: unless-stopped
    # Só em 127.0.0.1: de fora da máquina, só por túnel SSH
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - nextflow_postgres_data:/var/lib/postgresql/data
    networks:
      - nextflow-staging-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Storage de arquivos compatível com S3 (imagens de produtos). Programa: Silo, fork comunitário do MinIO.
  storage:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    # Sem "ports" da API S3: o navegador chega pelo proxy de borda (STORAGE_PUBLIC_URL).
    # Painel web só em 127.0.0.1 (de fora: túnel SSH)
    ports:
      - "127.0.0.1:${STORAGE_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ROOT_USER:?defina STORAGE_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${STORAGE_ROOT_PASSWORD:?defina STORAGE_ROOT_PASSWORD (mínimo 8 caracteres)}
    command: server /data --console-address ":9001"
    volumes:
      - nextflow_storage_data:/data
    networks:
      nextflow-staging-network:
      # Alias único: o nginx entrega STORAGE_PUBLIC_URL em nextflow-s3:9000
      proxy-net:
        aliases: [nextflow-s3]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  storage-initial-setup:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"
    volumes:
      - ./storage/init.sh:/init.sh:ro
    environment:
      MINIO_ROOT_USER: ${STORAGE_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${STORAGE_ROOT_PASSWORD}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?defina STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?defina STORAGE_SECRET_KEY (mínimo 8 caracteres)}
      STORAGE_BUCKET_PUBLIC: ${STORAGE_BUCKET_PUBLIC:-nextflow-public}
      STORAGE_BUCKET_PRIVATE: ${STORAGE_BUCKET_PRIVATE:-nextflow-private}
    networks:
      - nextflow-staging-network
    depends_on:
      storage:
        condition: service_healthy

  backend:
    image: nextflow-backend:staging
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: "Server=postgres;Port=5432;Database=${POSTGRES_DB};User Id=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Pooling=true;"
      JwtSettings__Key: ${JWT_KEY}
      # Seed de demonstração (loja de doces e presentes, 36 meses). AnchorDate vazio = hoje
      Seed__Demo__Enabled: ${SEED_DEMO_ENABLED:-true}
      Seed__Demo__AnchorDate: ${SEED_DEMO_ANCHOR_DATE:-}
      # Storage (S3): a API fala pela rede interna; o navegador abre as imagens pelo endereço público.
      # A URL assinada inclui o host, então STORAGE_PUBLIC_URL precisa ser exatamente o que o navegador chama
      Storage__Endpoint: http://storage:9000
      Storage__PublicUrl: "${STORAGE_PUBLIC_URL:?defina STORAGE_PUBLIC_URL, ex. https://nextflow-s3.zanni.tech}"
      Storage__AccessKey: ${STORAGE_ACCESS_KEY}
      Storage__SecretKey: ${STORAGE_SECRET_KEY}
      Storage__Buckets__Public: ${STORAGE_BUCKET_PUBLIC:-nextflow-public}
      Storage__Buckets__Private: ${STORAGE_BUCKET_PRIVATE:-nextflow-private}
      # Origens do front liberadas no CORS, separadas por vírgula. Vazio = qualquer origem
      Cors__AllowedOrigins: ${CORS_ORIGINS:-}
      # IA (Previsão de demanda) — sem AI_API_KEY o módulo roda só com o cálculo
      Ai__Provider: ${AI_PROVIDER:-Gemini}
      Ai__ApiKey: ${AI_API_KEY:-}
      Ai__Model: ${AI_MODEL:-gemini-flash-latest}
      Ai__TimeoutSeconds: ${AI_TIMEOUT_SECONDS:-60}
    # Sem "ports": quem recebe de fora é o proxy de borda (nextflow-api.zanni.tech)
    networks:
      # Rede privada: fala com o postgres
      nextflow-staging-network:
      # Rede do proxy de borda. Alias único: o nginx usa nextflow-api:8080
      proxy-net:
        aliases: [nextflow-api]
    depends_on:
      postgres:
        condition: service_healthy
      storage-initial-setup:
        condition: service_completed_successfully

networks:
  nextflow-staging-network:
    external: true
  proxy-net:
    external: true

volumes:
  nextflow_postgres_data:
  nextflow_storage_data:
